<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>404 - Página no encontrada</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
  <style>
    body {
      background-color: #0d0d0d;
      color: #00ff99;
      font-family: monospace;
      text-align: center;
      padding: 5%;
    }
    h1 {
      font-size: 6em;
      margin: 0;
    }
    p {
      font-size: 1.5em;
    }
    a {
      color: #00ff99;
      text-decoration: none;
      border: 1px solid #00ff99;
      padding: 10px 20px;
      border-radius: 8px;
      margin-top: 20px;
      display: inline-block;
      transition: 0.3s;
    }
    a:hover {
      background: #00ff99;
      color: #0d0d0d;
    }
    .glitch {
      font-size: 2em;
      position: relative;
      display: inline-block;
    }
    .glitch::before, .glitch::after {
      content: "404";
      position: absolute;
      left: 0;
      right: 0;
      color: #f00;
      background: #0d0d0d;
      overflow: hidden;
      clip: rect(0, 900px, 0, 0);
      animation: glitch 2s infinite linear alternate-reverse;
    }
    .glitch::after {
      color: #0ff;
      animation-delay: 1s;
    }
    @keyframes glitch {
      0% { clip: rect(0, 900px, 0, 0); }
      10% { clip: rect(10px, 900px, 50px, 0); }
      20% { clip: rect(40px, 900px, 90px, 0); }
      30% { clip: rect(20px, 900px, 60px, 0); }
      40% { clip: rect(60px, 900px, 100px, 0); }
      50% { clip: rect(10px, 900px, 80px, 0); }
      60% { clip: rect(30px, 900px, 70px, 0); }
      70% { clip: rect(20px, 900px, 90px, 0); }
      80% { clip: rect(50px, 900px, 100px, 0); }
      90% { clip: rect(40px, 900px, 60px, 0); }
      100% { clip: rect(0, 900px, 0, 0); }
    }
  </style>
</head>
<body>
  <h1 class="glitch">404</h1>
  <p>Oops... la página que buscas no existe.</p>
  <p>Tal vez el mensaje esté oculto en otra parte 👀</p>
  <a href="{{ url_for('index') }}">Volver al inicio</a>
</body>
</html>
